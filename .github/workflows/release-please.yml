name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR from Conventional Commits; merging it tags
      # the release and updates CHANGELOG.md + package.json. Config lives in
      # release-please-config.json (0.x semantics: feat bumps minor, fix
      # bumps patch, until a release-as promotes 1.0). Note: with the
      # default GITHUB_TOKEN, CI does not run on the release PR itself (a
      # GitHub limitation) — swap in a PAT via `token:` if that matters.
      - uses: googleapis/release-please-action@v4
