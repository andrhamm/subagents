# Copy to subagents.yaml and edit. Resolution order for --config:
#   explicit --config, then ./subagents.yaml, then ~/.config/subagents/config.yaml
providers:
  local: { base_url: "http://127.0.0.1:1234/v1", kind: lmstudio }

# Sampling is per model family. There is no universal setting, and wrong values
# produce wrong results that look real. Cite a source for anything added here.
sampling:
  # Gemma vendor guidance for factual/extraction work (0.1-0.3 factual).
  gemma-factual: { temperature: 0.3, top_p: 0.95, top_k: 64 }
  # Qwen3 non-thinking, vendor published. Qwen forbids greedy decoding.
  qwen-nonthinking: { temperature: 0.7, top_p: 0.8, top_k: 20 }

tiers:
  cheap: { provider: local, model: "google/gemma-4-e2b", sampling: gemma-factual }
  strong: { provider: local, model: "qwen3-coder-next", sampling: qwen-nonthinking }

profiles:
  digest: { tools: [read_file, glob, grep, list_dir], tier: cheap }
  audit: { tools: [read_file, glob, grep, list_dir], tier: strong }
  # Write profile: runs in a git worktree detached at HEAD; the envelope
  # reports the worktree path and diffstat. `checks` run there after the
  # loop, IN ORDER, stopping at the first failure — put the cheaper/more
  # informative stage first (tests before style: a broken test matters more
  # than a lint nit, and its output is better coaching for the next turn).
  # `test_cmd: "<cmd>"` is sugar for a single `checks: [{name: tests, cmd: "<cmd>"}]`
  # stage; give one or the other, never both. `run_checks` (zero-arg) lets
  # the delegate run this same pipeline itself mid-loop, capped at 3 calls —
  # the harness re-verifies once more after the loop either way. The `style`
  # stage below is a stand-in — replace `bun run lint` with your project's
  # actual lint/format-check command. (Bun's YAML parser wants flow
  # collections like `checks: [...]` on one line, so this uses block style.)
  fix:
    tools: [read_file, glob, grep, edit_file, write_file, run_checks]
    tier: strong
    checks:
      - { name: tests, cmd: "bun test" }
      - { name: style, cmd: "bun run lint" }

defaults:
  max_turns: 20
  max_tokens: 8000
  timeout_ms: 300000
  test_timeout_ms: 120000
